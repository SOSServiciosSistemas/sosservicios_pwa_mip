<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Servicio</title>
    <link rel="manifest" href="../manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dropdown-menu-plagas, .dropdown-menu-quimicos { max-height: 220px; overflow-y: auto; font-size: 0.85rem; }
        .etiqueta-flotante { font-size: 0.7rem; font-weight: bold; color: #6c757d; margin-bottom: 2px; text-transform: uppercase;}
        /* Estilo para las tarjetas de cada item agregado */
        .item-tarjeta { border-left: 4px solid #198754; background-color: #ffffff; }
        .item-quimico { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body class="bg-light">
    <!-- Header -->
    <nav class="navbar navbar-dark bg-success shadow-sm sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h6 text-truncate" id="titulo-folio" style="max-width: 70%;">Reporte...</span>
            <button id="btn-volver" class="btn btn-sm btn-outline-light">Volver</button>
        </div>
    </nav>

    <div class="container mt-3 mb-5 px-2">
        <form id="formulario-reporte">
            <!-- Bloque de textos -->
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body p-3">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary" style="font-size: 0.85rem;">ACCIONES CORRECTIVAS:</label>
                        <textarea class="form-control" id="acciones" rows="3" placeholder="Ej. Se aplicó gel en cocina..." required></textarea>
                    </div>
                    <div class="mb-1">
                        <label class="form-label fw-bold text-primary" style="font-size: 0.85rem;">INDICACIONES PRÓX. SERVICIO:</label>
                        <textarea class="form-control" id="indicaciones" rows="2" placeholder="Ej. Traer escalera para techo..." required></textarea>
                    </div>
                </div>
            </div>

            <!-- CONTENEDOR DE QUÍMICOS (Diseño Móvil) -->
            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="fw-bold text-primary">QUÍMICOS UTILIZADOS</span>
                <button type="button" class="btn btn-sm btn-primary rounded-pill shadow-sm" onclick="agregarFilaQuimico()">+ Químico</button>
            </div>
            <div id="contenedor-quimicos" class="mb-4">
                <!-- Tarjetas de químicos dinámicas -->
            </div>

            <!-- CONTENEDOR DE ÁREAS (Diseño Móvil) -->
            <div class="d-flex justify-content-between align-items-center mb-2 px-1 mt-4">
                <span class="fw-bold text-primary">ÁREAS TRATADAS</span>
                <button type="button" class="btn btn-sm btn-primary rounded-pill shadow-sm" onclick="agregarFilaArea()">+ Área</button>
            </div>
            <div id="contenedor-areas" class="mb-4">
                <!-- Tarjetas de áreas dinámicas -->
            </div>

            <!-- GRADO DE INFESTACIÓN -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white fw-bold text-primary text-center" style="font-size: 0.85rem;">
                    GRADO DE INFESTACIÓN GENERAL
                </div>
                <div class="card-body p-2 text-center">
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="grado_infestacion" id="gradoBajo" value="Bajo" required>
                        <label class="btn btn-outline-success btn-sm fw-bold" for="gradoBajo">BAJO</label>
                      
                        <input type="radio" class="btn-check" name="grado_infestacion" id="gradoModerado" value="Moderado">
                        <label class="btn btn-outline-warning btn-sm fw-bold" for="gradoModerado">MODERADO</label>
                      
                        <input type="radio" class="btn-check" name="grado_infestacion" id="gradoAlto" value="Alto">
                        <label class="btn btn-outline-danger btn-sm fw-bold" for="gradoAlto">ALTO</label>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DE COBRANZA DEL SERVICIO -->
            <div class="card shadow-sm border-0 mb-4" id="tarjeta-cobranza">
                <div class="card-header bg-white fw-bold text-primary d-flex justify-content-between align-items-center" style="font-size: 0.85rem;">
                    <span>💰 COBRANZA DEL SERVICIO</span>
                    <span id="badge-tipo-tratamiento" class="badge bg-secondary">Cargando...</span>
                </div>
                <div class="card-body p-3">
                    <div id="info-resumen-cobro" class="mb-3 small">
                        <!-- Inyectado dinámicamente -->
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold text-dark" style="font-size: 0.85rem;">EFECTIVO COBRADO EN ESTA VISITA ($):</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light fw-bold text-success">$</span>
                            <input type="number" step="0.50" min="0" class="form-control fw-bold text-success" id="rep-monto-cobrado" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-2" id="botones-atajo-cobro">
                        <!-- Botones dinámicos: Liquidar Saldo / Sin Cobro -->
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold py-3 shadow-lg rounded-3 mb-4" id="btn-guardar">
                ✅ Guardar y Finalizar Servicio
            </button>
        </form>

        <!-- MODAL DE ALERTA MESA DE CONTROL (REGLAS DE COBRANZA) -->
        <div class="modal fade" id="modalAlertaCobranza" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header bg-warning text-dark border-0">
                        <h5 class="modal-title fw-bold" id="tituloModalAlerta">⚠️ Aviso de Cobranza</h5>
                    </div>
                    <div class="modal-body p-4 text-center">
                        <div class="display-4 mb-3" id="iconoModalAlerta">📞</div>
                        <div id="cuerpoModalAlerta" class="text-start fs-6">
                            <!-- Inyectado dinámicamente -->
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0 justify-content-between">
                        <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal" id="btn-cancelar-alerta">
                            ✏️ Corregir Cobro
                        </button>
                        <button type="button" class="btn btn-warning fw-bold px-3 shadow-sm" id="btn-confirmar-alerta">
                            ✔ Mesa de Control Autorizó
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="mensaje-exito" class="alert alert-success d-none text-center mt-3 fw-bold shadow-sm">
            ¡Servicio registrado exitosamente!
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../config.js"></script> 
    
    <script>
        let inventarioOpciones = '<option value="">Sin inventario...</option>'; 
        let ordenActual = null;
        let alertaConfirmada = false;

        const catalogoPlagas = [
            { id: 'BG', nombre: 'Cucaracha Alemana' }, { id: 'PA', nombre: 'Cucaracha Americana' },
            { id: 'T', nombre: 'Tijerilla' }, { id: 'A', nombre: 'Araña' }, { id: 'H', nombre: 'Hormiga' },
            { id: 'G', nombre: 'Grillo' }, { id: 'C', nombre: 'Cochinilla' }, { id: 'Al', nombre: 'Alacrán' },
            { id: 'Pj', nombre: 'Plagas de jardín' }, { id: 'Ab', nombre: 'Abejas' },
            { id: 'PG', nombre: 'Plaga granos alm.' }, { id: 'CC', nombre: 'Chinche de cama' },
            { id: 'R', nombre: 'Roedor' }, { id: 'Otros', nombre: 'Otros' }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            const parametros = new URLSearchParams(window.location.search);
            const folio = parametros.get('folio');
            
            if(!folio) { window.location.href = "tecnico.html"; return; }

            document.getElementById('titulo-folio').innerText = `Folio: ${folio}`;
            document.getElementById('btn-volver').onclick = () => window.location.href = `orden.html?folio=${folio}`;

            await cargarInventarioTecnico();
            await cargarDatosOrden(folio);

            agregarFilaQuimico();
            agregarFilaArea();
        });

       async function cargarInventarioTecnico() {
            try {
                const res = await fetch(BASE_URL + '/api/inventario/tecnicos');
                const datos = await res.json();
                
                // MUESTRA LA CONSOLA:
                //console.log(" ASÍ LLEGA EL INVENTARIO DEL BACKEND:", datos.inventario);
                
                if (datos.exito) {
                    const miId = localStorage.getItem('idUsuario');
                    
                    const miInventario = datos.inventario.filter(item => {
                        // Atrapa el ID sin importar cómo lo haya bautizado el backend en el SQL
                        const idDueno = item.id_tecnico || item.id_usuario || item.id_encargado;
                        return idDueno == miId && parseFloat(item.cantidad_disponible) > 0;
                    });
                    
                    if (miInventario.length > 0) {
                        inventarioOpciones = '<option value="">Seleccione inventario...</option>';
                        miInventario.forEach(item => {
                            inventarioOpciones += `<option value="${item.clave_producto}">${item.clave_producto} (Disp: ${parseFloat(item.cantidad_disponible).toFixed(1)} ${item.unidad_medida})</option>`;
                        });
                        
                        // Forza a actualizar los selectores que ya estén en pantalla (la fila 1 que se crea por defecto)
                        document.querySelectorAll('.campo-clave').forEach(select => {
                            select.innerHTML = inventarioOpciones;
                        });
                    }
                }
            } catch (error) { 
                console.error("Error cargando inventario:", error); 
            }
        }

        // ==========================================
        // TARJETAS DE QUÍMICOS (Formato Móvil)
        // ==========================================
        function agregarFilaQuimico() {
            const contenedor = document.getElementById('contenedor-quimicos');
            const div = document.createElement('div');
            div.className = 'card shadow-sm mb-2 item-tarjeta item-quimico';
            div.innerHTML = `
                <div class="card-body p-2">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-primary rounded-pill px-3 py-2 fs-6">Producto N° <span class="numero-quimico">0</span></span>
                        <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="eliminarFilaQuimico(this)"> Quitar</button>
                    </div>
                    <div class="mb-2">
                        <div class="etiqueta-flotante">Clave del Químico</div>
                        <select class="form-select form-select-sm campo-clave border-primary" required>${inventarioOpciones}</select>
                    </div>
                    <div class="row g-2">
                        <div class="col-4">
                            <div class="etiqueta-flotante">Dosis</div>
                            <input type="number" step="0.01" class="form-control form-control-sm campo-dosis" placeholder="ml/Lt">
                        </div>
                        <div class="col-4">
                            <div class="etiqueta-flotante">Lts. Prep.</div>
                            <input type="number" step="0.01" class="form-control form-control-sm campo-litros" placeholder="Lts">
                        </div>
                        <div class="col-4">
                            <div class="etiqueta-flotante text-danger">Total Gasto</div>
                            <input type="number" step="0.01" class="form-control form-control-sm campo-gasto border-danger" placeholder="ml/gr" required>
                        </div>
                    </div>
                </div>
            `;
            contenedor.appendChild(div);
            actualizarNumeracionQuimicos();
        }

        function eliminarFilaQuimico(btn) {
            btn.closest('.item-quimico').remove();
            actualizarNumeracionQuimicos();
        }

        function actualizarNumeracionQuimicos() {
            const numQuimicosActivos = document.querySelectorAll('.item-quimico').length;
            const celdas = document.querySelectorAll('.numero-quimico');
            celdas.forEach((celda, index) => celda.innerText = index + 1);

            const listasAreas = document.querySelectorAll('.ul-quimicos-area');
            listasAreas.forEach(ul => {
                const seleccionados = Array.from(ul.querySelectorAll('.chk-quimico-area:checked')).map(chk => chk.value);
                ul.innerHTML = '';
                if (numQuimicosActivos === 0) {
                    ul.innerHTML = '<li><span class="dropdown-item text-muted small py-1">Agregue químicos arriba</span></li>';
                } else {
                    for(let i = 1; i <= numQuimicosActivos; i++) {
                        const estaChecked = seleccionados.includes(i.toString()) ? 'checked' : '';
                        ul.innerHTML += `<li><label class="dropdown-item py-2 border-bottom"><input type="checkbox" class="form-check-input me-2 chk-quimico-area" value="${i}" ${estaChecked}> N° ${i}</label></li>`;
                    }
                }
            });
        }

        // ==========================================
        // TARJETAS DE ÁREAS (Formato Móvil)
        // ==========================================
        function agregarFilaArea() {
            const contenedor = document.getElementById('contenedor-areas');
            const div = document.createElement('div');
            div.className = 'card shadow-sm mb-2 item-tarjeta item-area';
            
            let htmlPlagas = '';
            catalogoPlagas.forEach(p => {
                htmlPlagas += `<li><label class="dropdown-item py-2 border-bottom"><input type="checkbox" class="form-check-input me-2 chk-plaga" value="${p.id}"> <span class="fw-bold">${p.id}</span> - ${p.nombre}</label></li>`;
            });

            div.innerHTML = `
                <div class="card-body p-2">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold text-success" style="font-size:0.9rem;">Detalle de Área</span>
                        <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="this.closest('.item-area').remove()"> Quitar</button>
                    </div>
                    
                    <div class="row g-2 mb-2">
                        <div class="col-8">
                            <div class="etiqueta-flotante">Nombre del Área</div>
                            <input type="text" class="form-control form-control-sm campo-area" placeholder="Ej. Cocina / Almacén" required>
                        </div>
                        <div class="col-4">
                            <div class="etiqueta-flotante">Actividad</div>
                            <select class="form-select form-select-sm campo-actividad">
                                <option value="SI">SÍ</option>
                                <option value="NO">NO</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <div class="etiqueta-flotante">Plaga(s)</div>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-secondary w-100 dropdown-toggle text-truncate" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">Seleccionar</button>
                                <ul class="dropdown-menu dropdown-menu-plagas p-1 shadow-lg w-100">${htmlPlagas}</ul>
                            </div>
                            <input type="text" class="form-control form-control-sm mt-1 d-none campo-otro-txt" placeholder="¿Qué otra?">
                        </div>
                        <div class="col-6">
                            <div class="etiqueta-flotante">Producto(s) Aplicado</div>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-info w-100 dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">Sel. Producto</button>
                                <ul class="dropdown-menu ul-quimicos-area p-1 shadow-lg w-100"></ul>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-12 mb-1">
                            <div class="etiqueta-flotante">Método de Aplicación</div>
                            <select class="form-select form-select-sm campo-metodo">
                                <option value="">Seleccionar...</option>
                                <option value="Aspersión">Aspersión</option>
                                <option value="Nebulización">Nebulización</option>
                                <option value="Directo">Directo</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="etiqueta-flotante">Observaciones del Área</div>
                            <input type="text" class="form-control form-control-sm campo-observaciones" placeholder="Ej. Presencia de grasa, zoclos dañados...">
                        </div>
                    </div>
                </div>
            `;
            contenedor.appendChild(div);

            const chkOtro = div.querySelector('input[value="Otros"]');
            const txtOtro = div.querySelector('.campo-otro-txt');
            chkOtro.addEventListener('change', function() {
                if(this.checked) txtOtro.classList.remove('d-none');
                else txtOtro.classList.add('d-none');
            });

            actualizarNumeracionQuimicos();
        }

        // ==========================================
        // CARGA DE DATOS DE LA ORDEN Y COBRANZA
        // ==========================================
        async function cargarDatosOrden(folio) {
            try {
                const res = await fetch(`${BASE_URL}/api/orden/${folio}`);
                const datos = await res.json();
                if (!datos.exito || !datos.orden) return;

                ordenActual = datos.orden;
                const esMulti = Boolean(ordenActual.es_multitratamiento || (parseInt(ordenActual.total_tratamientos) > 1));
                const numTrat = parseInt(ordenActual.num_tratamiento) || 1;
                const totalTrat = parseInt(ordenActual.total_tratamientos) || 1;
                const costoTotal = parseFloat(ordenActual.costo_total_tratamiento || ordenActual.costo || ordenActual.ingresos_cobrados || 0);
                const pagadoPrevio = parseFloat(ordenActual.total_cobrado_previo || 0);
                const saldoPendiente = parseFloat(ordenActual.saldo_pendiente !== undefined ? ordenActual.saldo_pendiente : (ordenActual.ingresos_cobrados || 0));

                const badgeTipo = document.getElementById('badge-tipo-tratamiento');
                const infoResumen = document.getElementById('info-resumen-cobro');
                const inputMonto = document.getElementById('rep-monto-cobrado');
                const contenedorAtajos = document.getElementById('botones-atajo-cobro');

                inputMonto.addEventListener('input', () => { alertaConfirmada = false; });

                if (esMulti) {
                    badgeTipo.className = 'badge bg-primary';
                    badgeTipo.innerText = `Tratamiento ${numTrat} de ${totalTrat}`;

                    let detalleSaldoHTML = '';
                    if (saldoPendiente <= 0) {
                        detalleSaldoHTML = `
                            <div class="alert alert-success py-2 px-3 mb-2 text-center fw-bold">
                                ✔ TRATAMIENTO LIQUIDADO ($0.00)<br>
                                <span class="small fw-normal text-muted">Costo total ($${costoTotal.toFixed(2)}) pagado en visitas anteriores.</span>
                            </div>`;
                        inputMonto.value = '0.00';
                        contenedorAtajos.innerHTML = `
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="document.getElementById('rep-monto-cobrado').value = '0.00'; alertaConfirmada = false;">$0.00 (Liquidado)</button>
                        `;
                    } else {
                        const avisoAdeudo3 = (numTrat >= 3)
                            ? `<div class="alert alert-danger py-2 px-3 mt-2 mb-0 small fw-bold">⚠️ Atención: Cliente con adeudo en visita ${numTrat} de ${totalTrat}. Contactar a Mesa de Control si no liquida.</div>`
                            : '';

                        detalleSaldoHTML = `
                            <div class="p-2 border rounded bg-light mb-2">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>Costo Total Tratamiento:</span>
                                    <strong>$${costoTotal.toFixed(2)}</strong>
                                </div>
                                <div class="d-flex justify-content-between align-items-center text-muted">
                                    <span>Pagado en Visitas Previas:</span>
                                    <span>$${pagadoPrevio.toFixed(2)}</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center border-top mt-1 pt-1 text-danger fw-bold">
                                    <span>Saldo Pendiente a Cobrar:</span>
                                    <span class="fs-5">$${saldoPendiente.toFixed(2)}</span>
                                </div>
                                ${avisoAdeudo3}
                            </div>
                        `;
                        inputMonto.value = saldoPendiente.toFixed(2);
                        contenedorAtajos.innerHTML = `
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="document.getElementById('rep-monto-cobrado').value = '${saldoPendiente.toFixed(2)}'; alertaConfirmada = false;">Cobrar Saldo ($${saldoPendiente.toFixed(2)})</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('rep-monto-cobrado').value = '0.00'; alertaConfirmada = false;">Sin Cobro ($0.00)</button>
                        `;
                    }
                    infoResumen.innerHTML = detalleSaldoHTML;
                } else {
                    badgeTipo.className = 'badge bg-secondary';
                    badgeTipo.innerText = 'Servicio Único';
                    infoResumen.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center p-2 border rounded bg-light mb-2">
                            <span>Costo del Servicio:</span>
                            <strong class="fs-5 text-success">$${costoTotal.toFixed(2)}</strong>
                        </div>
                    `;
                    inputMonto.value = costoTotal.toFixed(2);
                    contenedorAtajos.innerHTML = `
                        <button type="button" class="btn btn-sm btn-outline-success" onclick="document.getElementById('rep-monto-cobrado').value = '${costoTotal.toFixed(2)}'; alertaConfirmada = false;">Monto Completo ($${costoTotal.toFixed(2)})</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('rep-monto-cobrado').value = '0.00'; alertaConfirmada = false;">Sin Cobro ($0.00)</button>
                    `;
                }
            } catch (err) {
                console.error("Error al cargar datos de cobranza de la orden:", err);
            }
        }

        // ==========================================
        // VALIDACIÓN DE COBRANZA (REGLAS MESA DE CONTROL)
        // ==========================================
        function verificarReglasCobranza(monto) {
            if (!ordenActual) return { requiereAlerta: false };

            const esMulti = Boolean(ordenActual.es_multitratamiento || (parseInt(ordenActual.total_tratamientos) > 1));
            if (!esMulti) return { requiereAlerta: false };

            const numTrat = parseInt(ordenActual.num_tratamiento) || 1;
            const totalTrat = parseInt(ordenActual.total_tratamientos) || 1;
            const costoTotal = parseFloat(ordenActual.costo_total_tratamiento || ordenActual.costo || ordenActual.ingresos_cobrados || 0);
            const saldoPendiente = parseFloat(ordenActual.saldo_pendiente !== undefined ? ordenActual.saldo_pendiente : (ordenActual.ingresos_cobrados || 0));

            // Regla 1: En visita 1, si el cliente paga menos del 50% del total
            if (numTrat === 1 && costoTotal > 0) {
                const minimo50 = costoTotal * 0.5;
                if (monto < minimo50) {
                    return {
                        requiereAlerta: true,
                        titulo: '⚠️ Autorización Requerida - Mesa de Control',
                        icono: '📞',
                        cuerpo: `
                            <p>El cliente está pagando <strong>$${monto.toFixed(2)}</strong>, lo cual es <strong>menos del 50%</strong> del costo total del tratamiento ($${costoTotal.toFixed(2)}).</p>
                            <p class="text-danger fw-bold">Por regla de cobranza, debes llamar a Mesa de Control para validar y autorizar que el cliente pague menos del 50% en el primer servicio.</p>
                            <p class="mb-0 small text-muted">¿Ya te comunicaste con Mesa de Control y autorizaron continuar?</p>
                        `,
                        btnTexto: '✔ Mesa de Control Autorizó (Continuar)'
                    };
                }
            }

            // Regla 2: En visita 2, si no se liquida el tratamiento
            if (numTrat === 2) {
                if (saldoPendiente > 0 && monto < saldoPendiente) {
                    const adeudoRestante = Math.max(0, saldoPendiente - monto);
                    return {
                        requiereAlerta: true,
                        titulo: '⚠️ Aviso de Cobranza - Visita 2',
                        icono: '⚠️',
                        cuerpo: `
                            <p>El tratamiento debe quedar liquidado en las dos primeras visitas.</p>
                            <p>El saldo pendiente es de <strong>$${saldoPendiente.toFixed(2)}</strong> y registraste un cobro de <strong>$${monto.toFixed(2)}</strong>.<br>
                            El cliente quedaría con un adeudo de <strong class="text-danger">$${adeudoRestante.toFixed(2)}</strong>.</p>
                            <p class="text-danger fw-bold">Ocupas contactar a Mesa de Control para confirmar si el cliente puede quedar con adeudo para visitas posteriores.</p>
                            <p class="mb-0 small text-muted">¿Mesa de Control ya confirmó y autorizó dejar este adeudo?</p>
                        `,
                        btnTexto: '✔ Mesa de Control Autorizó Adeudo'
                    };
                }
            }

            // Regla 3: En visita 3 o posterior (incluyendo la última visita ej. 4 de 4)
            if (numTrat >= 3) {
                if (saldoPendiente > 0 && monto < saldoPendiente) {
                    const adeudoRestante = Math.max(0, saldoPendiente - monto);
                    const esUltima = (numTrat === totalTrat);

                    if (esUltima) {
                        return {
                            requiereAlerta: true,
                            titulo: '🚨 Alerta Crítica: Adeudo en Último Servicio',
                            icono: '🛑',
                            cuerpo: `
                                <p>Este es el <strong>último servicio (${numTrat} de ${totalTrat})</strong> del tratamiento y el cliente aún presenta un adeudo de <strong class="text-danger">$${adeudoRestante.toFixed(2)}</strong>.</p>
                                <p class="text-danger fw-bold">Es indispensable comunicarte de inmediato con Mesa de Control antes de concluir este servicio.</p>
                                <p class="mb-0 small text-muted">¿Ya contactaste a Mesa de Control y autorizaron el cierre con adeudo?</p>
                            `,
                            btnTexto: '✔ Mesa de Control Notificada'
                        };
                    } else {
                        return {
                            requiereAlerta: true,
                            titulo: '⚠️ Alerta de Cobranza - Servicio con Adeudo',
                            icono: '⚠️',
                            cuerpo: `
                                <p>Este servicio corresponde a la visita <strong>${numTrat} de ${totalTrat}</strong>. El tratamiento debió liquidarse en la 2da visita.</p>
                                <p>Saldo pendiente: <strong>$${saldoPendiente.toFixed(2)}</strong> | Cobrado: <strong>$${monto.toFixed(2)}</strong><br>
                                Adeudo restante: <strong class="text-danger">$${adeudoRestante.toFixed(2)}</strong>.</p>
                                <p class="text-danger fw-bold">Contacta a Mesa de Control para reportar que este cliente continúa con adeudo.</p>
                                <p class="mb-0 small text-muted">¿Mesa de Control está enterada y autorizó continuar?</p>
                            `,
                            btnTexto: '✔ Mesa de Control Enterada'
                        };
                    }
                }
            }

            return { requiereAlerta: false };
        }

        // ==========================================
        // ENVÍO DE DATOS
        // ==========================================
        document.getElementById('formulario-reporte').addEventListener('submit', async (e) => {
            e.preventDefault();

            const inputMonto = document.getElementById('rep-monto-cobrado');
            const montoCobrado = parseFloat(inputMonto.value) || 0;

            // Validación de reglas de cobranza si aún no se ha confirmado la alerta
            if (!alertaConfirmada) {
                const alerta = verificarReglasCobranza(montoCobrado);
                if (alerta.requiereAlerta) {
                    document.getElementById('tituloModalAlerta').innerText = alerta.titulo;
                    document.getElementById('iconoModalAlerta').innerText = alerta.icono;
                    document.getElementById('cuerpoModalAlerta').innerHTML = alerta.cuerpo;
                    
                    const btnConfirmar = document.getElementById('btn-confirmar-alerta');
                    btnConfirmar.innerText = alerta.btnTexto;

                    const modalElement = document.getElementById('modalAlertaCobranza');
                    const modal = new bootstrap.Modal(modalElement);

                    btnConfirmar.onclick = () => {
                        alertaConfirmada = true;
                        modal.hide();
                        document.getElementById('formulario-reporte').requestSubmit();
                    };

                    modal.show();
                    return;
                }
            }
    
            const areas = [];
            document.querySelectorAll('.item-area').forEach(fila => {
                const nombreArea = fila.querySelector('.campo-area').value;
                if(nombreArea.trim() !== "") {
                    const plagasSeleccionadas = [];
                    fila.querySelectorAll('.chk-plaga:checked').forEach(chk => {
                        if (chk.value === 'Otros') {
                            const especifico = fila.querySelector('.campo-otro-txt').value;
                            plagasSeleccionadas.push(especifico ? especifico : 'Otros');
                        } else {
                            plagasSeleccionadas.push(chk.value);
                        }
                    });

                    const quimicosArea = [];
                    fila.querySelectorAll('.chk-quimico-area:checked').forEach(chk => quimicosArea.push(chk.value));

                    areas.push({
                        area: nombreArea,
                        actividad: fila.querySelector('.campo-actividad').value,
                        plagas: plagasSeleccionadas.join(', '),
                        productos_num: quimicosArea.join(', '),
                        metodo: fila.querySelector('.campo-metodo').value,
                        observaciones: fila.querySelector('.campo-observaciones').value
                    });
                }
            });

            const productos = [];
            document.querySelectorAll('.item-quimico').forEach((fila, idx) => {
                const clave = fila.querySelector('.campo-clave').value;
                if(clave.trim() !== "") { 
                    productos.push({
                        numero_producto: idx + 1,
                        clave_producto: clave,
                        dosis: fila.querySelector('.campo-dosis').value || 0,
                        litros_preparados: fila.querySelector('.campo-litros').value || 0,
                        gasto_real: fila.querySelector('.campo-gasto').value
                    });
                }
            });

            const radioGrado = document.querySelector('input[name="grado_infestacion"]:checked');
            const gradoInfestacion = radioGrado ? radioGrado.value : 'No evaluado';

            const detallesJSON = {
                acciones_correctivas: document.getElementById('acciones').value,
                indicaciones_proximas: document.getElementById('indicaciones').value,
                grado_infestacion: gradoInfestacion,
                tabla_areas: areas,
                tabla_productos: productos
            };

            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = "⏳ Guardando...";
            btnGuardar.disabled = true;

            try {
                const folio = new URLSearchParams(window.location.search).get('folio');
                const horaInicio = localStorage.getItem('hora_inicio_' + folio) || new Date().toISOString();
                const horaFin = new Date().toISOString(); 

                const respuesta = await fetch(BASE_URL + '/api/reportes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_orden: folio,
                        letra: 'A', 
                        hora_inicio: horaInicio, 
                        hora_fin: horaFin,       
                        detalles: detallesJSON,
                        id_tecnico: localStorage.getItem('idUsuario'),
                        monto_cobrado: montoCobrado
                    })
                });

                const datos = await respuesta.json();
                
                if(datos.exito) {
                    // CASO DE ÉXITO: Oculta el formulario, muestra el mensaje y redirecciona
                    document.getElementById('formulario-reporte').classList.add('d-none');
                    document.getElementById('mensaje-exito').classList.remove('d-none');
                    localStorage.removeItem('hora_inicio_' + folio);
                    
                    // Salta a la carpeta de documentos para la firma
                    setTimeout(() => window.location.href = `../documentosclientes/reportecliente.html?folio=${folio}`, 2000); 
                    
                } else {
                    // CASO DE ERROR: El servidor respondió, pero hubo un fallo (ej. base de datos caída)
                    alert("Error del servidor: " + datos.error);
                    btnGuardar.innerText = "Reintentar";
                    btnGuardar.disabled = false;
                }
                
            } catch (error) {
                alert("Error de conexión.");
                btnGuardar.innerText = "Reintentar";
                btnGuardar.disabled = false;
            }
        });
    </script>
</body>
</html>
