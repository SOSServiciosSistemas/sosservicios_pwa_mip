<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - SOS Servicios</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="panelprincipal.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">SOS Servicios | Admin</span>
            <button class="btn btn-outline-light btn-sm" id="btn-cerrar-sesion">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <!-- Menú de Pestañas (Tabs) -->
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios" type="button" role="tab">👤 Usuarios</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="clientes-tab" data-bs-toggle="tab" data-bs-target="#clientes" type="button" role="tab">🏢 Clientes</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos" type="button" role="tab">📦 Productos (Químicos)</button>
            </li>
        </ul>

        <!-- Contenedor del contenido de las pestañas -->
        <div class="tab-content" id="adminTabsContent">
            
            <!-- ========================================== -->
            <!-- PESTAÑA 1: USUARIOS                        -->
            <!-- ========================================== -->
            <div class="tab-pane fade show active" id="usuarios" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Gestión de Usuarios</h4>
                    <button class="btn btn-success" id="btn-nuevo-usuario">+ Nuevo Usuario</button>
                </div>
                <div class="table-responsive bg-white shadow-sm rounded">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Estatus</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <!-- Este espacio se llenará automáticamente con Javascript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- PESTAÑA 2: CLIENTES                        -->
            <!-- ========================================== -->
            <div class="tab-pane fade" id="clientes" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Gestión de Clientes</h4>
                </div>
                <div class="table-responsive bg-white shadow-sm rounded">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre / Empresa</th>
                                <th>Clase</th>
                                <th>Estatus</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-clientes">
                            <!-- Este espacio se llenará automáticamente con Javascript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- PESTAÑA 3: PRODUCTOS (QUÍMICOS)            -->
            <!-- ========================================== -->
            <div class="tab-pane fade" id="productos" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Catálogo de Productos</h4>
                    <button class="btn btn-success" id="btn-nuevo-producto">+ Nuevo Producto</button>
                </div>
                <div class="table-responsive bg-white shadow-sm rounded">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Ingrediente Activo</th>
                                <th>Estatus</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos">
                            <!-- Este espacio se llenará automáticamente con Javascript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div> <!-- Fin de tab-content -->
    </div> <!-- Fin de container -->

    <!-- ========================================== -->
    <!-- SCRIPTS                                    -->
    <!-- ========================================== -->
    <!-- 1. Funcionalidad de las pestañas de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 2. Variable global de conexión (BASE_URL) -->
    <script src="../config.js"></script> 
    
    <!-- 3. Lógica principal del administrador -->
    <script src="panelprincipal.js"></script>

</body>
</html>
